    nom: "Tenue de comptabilité"
    description: "Saisie des pièces, rapprochements bancaires, suivi de trésorerie."
  - id: bilan_annuel
    nom: "Bilan et comptes annuels"
    description: "Établissement du bilan, du compte de résultat, de la liasse fiscale et dépôt des comptes."
  - id: declarations_fiscales
    nom: "Déclarations fiscales"
    description: "TVA, CFE, impôt sur les sociétés, déclaration de revenus des dirigeants."
