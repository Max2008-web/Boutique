[project]
name = "agent-email"
version = "0.1.0"
description = "Agent IA autonome de gestion des emails pour PME (Gmail + Anthropic)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.1",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests qui appellent les vraies API (Anthropic). Lancés seulement si ANTHROPIC_API_KEY est défini.",
]
