<title>Strike Zone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout : jeu plein écran (canvas WebGL) + HUD DOM + panneaux de menu centrés. Look unique sombre "zone de quarantaine". */
:root {
  --bg: #0a0d0c;
  --panel: rgba(9, 13, 12, 0.86);
  --line: rgba(232, 239, 233, 0.14);
  --fg: #e8efe9;
  --dim: #8fa197;
  --accent: #ffb21a;
  --danger: #ff4a3d;
  --ok: #5ee08a;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); touch-action: none; -webkit-user-select: none; user-select: none; }
body { font-family: var(--font-mono); font-size: 14px; }
canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--font-display); }
#hud[hidden] { display: none !important; }
.hud-top { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); text-align: center; }
.hud-wave { font-size: clamp(22px, 4.2vmin, 40px); font-weight: 800; letter-spacing: 0.06em; text-shadow: 0 2px 0 #000; }
.hud-sub { font-family: var(--font-mono); font-size: clamp(11px, 1.6vmin, 14px); color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; }
.hud-points { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); text-align: right; }
.hud-points b { display: block; font-size: clamp(22px, 4vmin, 38px); color: var(--accent); font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 #000; }
.hud-points span { font-family: var(--font-mono); font-size: 11px; color: var(--dim); letter-spacing: 0.1em; }
.hud-vitals { position: absolute; left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(34vw, 300px); }
.bar { height: 12px; background: rgba(0,0,0,0.55); border: 1px solid var(--line); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--ok); transition: width 0.12s; }
.bar.low i { background: var(--danger); }
.hud-vitals .hp { font-size: clamp(26px, 4.5vmin, 44px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.hud-ammo { position: absolute; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: right; }
.hud-ammo .mag { font-size: clamp(34px, 7vmin, 64px); font-weight: 800; line-height: 0.9; font-variant-numeric: tabular-nums; }
.hud-ammo .mag small { font-size: 0.42em; color: var(--dim); font-weight: 500; }
.hud-ammo .mag.empty { color: var(--danger); }
.hud-ammo .wname { font-size: clamp(14px, 2.4vmin, 20px); color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
.slots { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 6px; font-family: var(--font-mono); font-size: 11px; }
.slots span { padding: 2px 6px; border: 1px solid var(--line); color: var(--dim); }
.slots span.on { border-color: var(--accent); color: var(--accent); }
.touch .hud-ammo { bottom: auto; top: calc(70px + env(safe-area-inset-top, 0px)); }
.touch .hud-vitals { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(70px + env(safe-area-inset-left, 0px)); width: min(30vw, 220px); }
.touch .hud-vitals .hp { font-size: 22px; }

#crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#crosshair i { position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.5); }
#crosshair .h { width: 9px; height: 2px; top: -1px; }
#crosshair .v { width: 2px; height: 9px; left: -1px; }
#crosshair .dot { width: 3px; height: 3px; left: -1.5px; top: -1.5px; background: var(--danger); opacity: 0; }
#hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; opacity: 0; }
#hitmarker::before, #hitmarker::after { content: ""; position: absolute; left: 12px; top: -2px; width: 2px; height: 30px; background: currentColor; transform: rotate(45deg); box-shadow: 0 0 0 1px rgba(0,0,0,0.4); }
#hitmarker::after { transform: rotate(-45deg); }
#scope { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at center, transparent 0 38vmin, rgba(0,0,0,0.92) 38.4vmin); }
#vignette { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at center, transparent 45%, rgba(170, 0, 0, 0.75)); transition: opacity 0.15s; }
#dmgdir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
#dmgdir i { position: absolute; left: -40px; top: calc(-1 * min(22vmin, 170px)); width: 80px; height: 10px; background: var(--danger); clip-path: polygon(0 100%, 50% 0, 100% 100%); }
#announce { position: absolute; top: 26%; left: 0; right: 0; text-align: center; font-size: clamp(30px, 7vmin, 72px); font-weight: 800; letter-spacing: 0.08em; color: var(--accent); text-shadow: 0 3px 0 #000; opacity: 0; transition: opacity 0.3s; padding-inline: 16px; text-wrap: balance; }
#prompt { position: absolute; top: 62%; left: 0; right: 0; text-align: center; font-family: var(--font-mono); font-size: clamp(13px, 2.2vmin, 17px); padding-inline: 16px; }
#prompt span { background: var(--panel); border: 1px solid var(--accent); padding: 6px 12px; }
#stats { position: absolute; left: calc(18px + env(safe-area-inset-left, 0px)); top: 34%; font-family: var(--font-mono); font-size: 13px; line-height: 1.7; background: var(--panel); border-left: 3px solid var(--accent); padding: 10px 14px; }
.touch #stats { top: 46%; font-size: 11px; }

/* ---------- Commandes tactiles ---------- */
#touch { position: fixed; inset: 0; z-index: 5; }
#touch[hidden] { display: none !important; }
.tbtn { position: absolute; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; letter-spacing: 0.06em; color: var(--fg); background: rgba(0,0,0,0.38); border: 2px solid rgba(232,239,233,0.45); font-size: clamp(11px, 2.3vmin, 16px); }
.tbtn.on { background: rgba(255,178,26,0.55); border-color: var(--accent); }
.tbtn.fire { background: rgba(255,74,61,0.35); }
#joy { position: absolute; width: 22vmin; height: 22vmin; margin: -11vmin; border-radius: 50%; border: 2px solid rgba(232,239,233,0.35); background: rgba(0,0,0,0.25); left: 16%; top: 74%; }
#joy i { position: absolute; width: 9vmin; height: 9vmin; left: 50%; top: 50%; margin: -4.5vmin; border-radius: 50%; background: rgba(232,239,233,0.5); }

/* ---------- Menus ---------- */
.screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow-y: auto; background: linear-gradient(180deg, rgba(10,13,12,0.55), rgba(10,13,12,0.92)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); }
.panel { width: min(860px, 100%); display: grid; gap: 18px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 11vmin, 104px); line-height: 0.85; letter-spacing: 0.02em; margin: 0; text-transform: uppercase; }
.brand em { font-style: normal; color: var(--accent); -webkit-text-stroke: 0; }
.tape { display: inline-block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #111; padding: 4px 10px; background: repeating-linear-gradient(-45deg, var(--accent) 0 14px, #1b1b1b 14px 28px); }
.tape b { background: var(--accent); padding: 0 6px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.mode { text-align: left; cursor: pointer; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); font: inherit; display: grid; gap: 6px; min-width: 0; }
.mode:hover, .mode:focus-visible { border-color: var(--accent); outline: none; }
.mode h3 { margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
.mode p { margin: 0; color: var(--dim); font-size: 12.5px; line-height: 1.5; }
.mode .go { color: var(--accent); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
.row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 18px; background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; }
.settings label { display: grid; gap: 6px; font-size: 11px; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; min-width: 0; }
.settings input[type=range] { width: 100%; accent-color: var(--accent); }
.settings select { background: #111614; color: var(--fg); border: 1px solid var(--line); padding: 6px; font: inherit; font-size: 13px; }
.settings .check { display: flex; gap: 8px; align-items: center; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--fg); }
.btn { cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 22px; background: var(--accent); color: #111; border: 0; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.keys { color: var(--dim); font-size: 12px; line-height: 1.7; max-width: 70ch; }
.keys kbd { font-family: var(--font-mono); color: var(--fg); border: 1px solid var(--line); padding: 0 5px; }
.big { font-family: var(--font-display); font-size: clamp(36px, 8vmin, 72px); font-weight: 800; margin: 0; line-height: 0.95; text-wrap: balance; }
.score { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.score div { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; }
.score b { display: block; font-family: var(--font-display); font-size: 32px; color: var(--accent); font-variant-numeric: tabular-nums; }
.score span { font-size: 11px; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; }
.note { font-size: 12px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { #announce, .bar i, #vignette { transition: none; } }
</style>

<canvas id="view"></canvas>

<div id="hud" hidden>
  <div id="scope"></div>
  <div id="vignette"></div>
  <div class="hud-top"><div class="hud-wave" id="hWave">VAGUE 1</div><div class="hud-sub" id="hSub">Zombies restants : 0</div></div>
  <div class="hud-points" id="hPointsBox"><b id="hPoints">500</b><span>POINTS</span></div>
  <div class="hud-vitals"><div class="hp" id="hHp">100</div><div class="bar" id="hBar"><i id="hBarFill" style="width:100%"></i></div></div>
  <div class="hud-ammo"><div class="slots" id="hSlots"></div><div class="mag" id="hMag">12<small> / 60</small></div><div class="wname" id="hWeapon">P-9</div></div>
  <div id="crosshair"><i class="h" id="chL"></i><i class="h" id="chR"></i><i class="v" id="chT"></i><i class="v" id="chB"></i><i class="dot" id="chDot"></i></div>
  <div id="hitmarker"></div>
  <div id="dmgdir"><i></i></div>
  <div id="announce"></div>
  <div id="prompt"></div>
  <div id="stats" hidden></div>
</div>

<div id="touch" hidden>
  <div id="joy" hidden><i id="joyThumb"></i></div>
  <div class="tbtn" data-btn="pause" style="left:calc(10px + env(safe-area-inset-left,0px)); top:calc(10px + env(safe-area-inset-top,0px)); width:9vmin; height:9vmin;">II</div>
  <div class="tbtn fire" data-btn="fire" style="right:7%; bottom:24%; width:19vmin; height:19vmin;">FEU</div>
  <div class="tbtn fire" data-btn="fire2" style="left:5%; top:34%; width:12vmin; height:12vmin;">FEU</div>
  <div class="tbtn" data-btn="ads" style="right:27%; bottom:12%; width:13vmin; height:13vmin;">VISER</div>
  <div class="tbtn" data-btn="jump" style="right:calc(3% + env(safe-area-inset-right,0px)); bottom:6%; width:12vmin; height:12vmin;">SAUT</div>
  <div class="tbtn" data-btn="crouch" style="right:15%; bottom:3%; width:11vmin; height:11vmin;">ACCR.</div>
  <div class="tbtn" data-btn="reload" style="right:24%; bottom:36%; width:11vmin; height:11vmin;">RECH.</div>
  <div class="tbtn" data-btn="use" style="right:37%; bottom:30%; width:11vmin; height:11vmin;">UTIL.</div>
  <div class="tbtn" data-btn="swap" style="right:39%; bottom:8%; width:11vmin; height:11vmin;">ARME</div>
</div>

<section class="screen" id="menu">
  <div class="panel">
    <div><span class="tape"><b>ZONE 7</b> &nbsp;quarantaine active&nbsp;</span></div>
    <h1 class="brand">Strike<br><em>Zone</em></h1>
    <div class="modes">
      <button class="mode" id="playZombies" type="button"><h3>Zombies</h3><p>Survivez aux vagues. Marcheurs, coureurs, brutes et un boss toutes les 5 vagues. Gagnez des points, achetez des armes sur les murs.</p><span class="go">Lancer la survie →</span></button>
      <button class="mode" id="playTraining" type="button"><h3>Entraînement</h3><p>Stand de tir : cibles fixes et mobiles de 10 à 45 m, les 4 armes, munitions infinies, statistiques de précision.</p><span class="go">Ouvrir le stand →</span></button>
    </div>
    <div class="settings" id="settingsMain"></div>
    <p class="keys" id="keysHelp"></p>
    <p class="note" id="bestNote"></p>
  </div>
</section>

<section class="screen" id="pause" hidden>
  <div class="panel">
    <p class="big">Pause</p>
    <div class="row"><button class="btn" id="resume" type="button">Reprendre</button><button class="btn ghost" id="resetStats" type="button" hidden>Remettre les stats à zéro</button><button class="btn ghost" id="toMenu" type="button">Menu</button></div>
    <div class="settings" id="settingsPause"></div>
  </div>
</section>

<section class="screen" id="over" hidden>
  <div class="panel">
    <span class="tape"><b>FIN</b> &nbsp;signal perdu&nbsp;</span>
    <p class="big" id="overTitle">Submergé à la vague 1</p>
    <div class="score" id="overScore"></div>
    <div class="row"><button class="btn" id="again" type="button">Rejouer</button><button class="btn ghost" id="overMenu" type="button">Menu</button></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const isTouch = matchMedia("(pointer: coarse)").matches || ("ontouchstart" in window && navigator.maxTouchPoints > 0);
if (isTouch) document.body.classList.add("touch");

// ------------------------------------------------------------------ Réglages
const store = {
  get(k, d) { try { const v = localStorage.getItem("sz_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sz_" + k, JSON.stringify(v)); } catch (e) {} }
};
const S = Object.assign({ sens: 1, touchSens: 1, quality: isTouch ? "low" : "high", invertY: false, sound: true }, store.get("settings", {}));

function buildSettings(host) {
  host.innerHTML = `
    <label>Sensibilité souris <input type="range" min="0.2" max="3" step="0.05" data-k="sens"></label>
    <label>Sensibilité tactile <input type="range" min="0.2" max="3" step="0.05" data-k="touchSens"></label>
    <label>Graphismes <select data-k="quality"><option value="low">Bas (mobile)</option><option value="medium">Moyen</option><option value="high">Élevé</option></select></label>
    <label class="check"><input type="checkbox" data-k="invertY"> Inverser l'axe vertical</label>
    <label class="check"><input type="checkbox" data-k="sound"> Son</label>`;
  host.querySelectorAll("[data-k]").forEach((el, i) => {
    const k = el.dataset.k;
    el.id = host.id + "_" + k;
    if (el.type === "checkbox") el.checked = !!S[k]; else el.value = S[k];
    el.addEventListener("input", () => {
      S[k] = el.type === "checkbox" ? el.checked : (el.type === "range" ? parseFloat(el.value) : el.value);
      store.set("settings", S);
      if (k === "quality") applyQuality();
      syncSettings();
    });
  });
}
function syncSettings() {
  document.querySelectorAll(".settings [data-k]").forEach((el) => {
    const k = el.dataset.k;
    if (el.type === "checkbox") el.checked = !!S[k]; else if (document.activeElement !== el) el.value = S[k];
  });
}
buildSettings($("settingsMain"));
buildSettings($("settingsPause"));
$("keysHelp").innerHTML = isTouch
  ? "Joystick à gauche pour avancer (poussé à fond = sprint). Glissez à droite pour viser. FEU tire, VISER zoome, UTIL. achète les armes au mur."
  : "<kbd>Z Q S D</kbd> / <kbd>W A S D</kbd> bouger · <kbd>Souris</kbd> viser · <kbd>Clic G</kbd> tirer · <kbd>Clic D</kbd> visée · <kbd>Maj</kbd> sprint · <kbd>Espace</kbd> saut · <kbd>C</kbd> accroupi · <kbd>R</kbd> recharger · <kbd>E</kbd> acheter · <kbd>1-4</kbd> / molette armes · <kbd>Échap</kbd> pause";
function showBest() { const b = store.get("bestWave", 0); $("bestNote").textContent = b > 0 ? `Record : vague ${b} atteinte.` : "Aucun record pour l'instant."; }
showBest();

// ------------------------------------------------------------------ Rendu
const canvas = $("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isTouch, powerPreference: "high-performance" });
renderer.autoClear = false;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2320);
scene.fog = new THREE.Fog(0x1a2320, 18, 70);
const camera = new THREE.PerspectiveCamera(80, 1, 0.05, 200);
camera.rotation.order = "YXZ";
const gunScene = new THREE.Scene();
const gunCam = new THREE.PerspectiveCamera(65, 1, 0.01, 10);

const hemi = new THREE.HemisphereLight(0xcfe3d6, 0x2a2420, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2b8, 0.95);
sun.position.set(18, 30, 12);
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 90 });
scene.add(sun);
gunScene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 0.9));
const gunSun = new THREE.DirectionalLight(0xffffff, 0.6); gunSun.position.set(1, 2, 1); gunScene.add(gunSun);
const muzzleLight = new THREE.PointLight(0xffb060, 0, 6);
gunScene.add(muzzleLight);

function applyQuality() {
  const dpr = window.devicePixelRatio || 1;
  const q = S.quality;
  renderer.setPixelRatio(q === "low" ? Math.min(dpr, 1) * 0.85 : q === "medium" ? Math.min(dpr, 1.5) : Math.min(dpr, 2));
  renderer.shadowMap.enabled = q === "high";
  sun.castShadow = q === "high";
  scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; });
  resize();
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = gunCam.aspect = w / h;
  camera.updateProjectionMatrix(); gunCam.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

// ------------------------------------------------------------------ Monde
const ARENA = 30; // demi-taille (m)
const boxes = []; // obstacles {minX,maxX,minZ,maxZ,h,mesh}
const worldMeshes = [];

function concreteTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "#3b4340"; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2200; i++) { const v = 50 + Math.random() * 30; g.fillStyle = `rgba(${v},${v + 6},${v + 3},0.35)`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
  g.strokeStyle = "rgba(0,0,0,0.35)"; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; return t;
}
function hazardTexture() {
  const c = document.createElement("canvas"); c.width = 128; c.height = 32;
  const g = c.getContext("2d");
  for (let x = -32; x < 160; x += 32) { g.fillStyle = "#ffb21a"; g.beginPath(); g.moveTo(x, 32); g.lineTo(x + 16, 0); g.lineTo(x + 32, 0); g.lineTo(x + 16, 32); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; return t;
}
const floorTex = concreteTexture(); floorTex.repeat.set(15, 15);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 2 + 4, ARENA * 2 + 4), new THREE.MeshLambertMaterial({ map: floorTex }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor); worldMeshes.push(floor);
const stripe = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 2, 0.6), new THREE.MeshBasicMaterial({ map: (() => { const t = hazardTexture(); t.repeat.set(30, 1); return t; })(), transparent: true }));
stripe.rotation.x = -Math.PI / 2; stripe.position.y = 0.01;

const matWall = new THREE.MeshLambertMaterial({ color: 0x59615d });
const matCrate = new THREE.MeshLambertMaterial({ color: 0x7a5a30 });
const matConc = new THREE.MeshLambertMaterial({ color: 0x6d7570 });
const unitBox = new THREE.BoxGeometry(1, 1, 1);
function addBox(x, z, w, d, h, mat) {
  const m = new THREE.Mesh(unitBox, mat);
  m.scale.set(w, h, d); m.position.set(x, h / 2, z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m); worldMeshes.push(m);

  const src = actx.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = pitch;
  const f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(5200 * pitch, t); f.frequency.exponentialRampToValueAtTime(300, t + len);
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);

}

}

// ------------------------------------------------------------------ Collisions
function pushOutOfBoxes(pos, r) {
  for (const b of boxes) {
    const cx = Math.max(b.minX, Math.min(pos.x, b.maxX));
    const cz = Math.max(b.minZ, Math.min(pos.z, b.maxZ));
    let dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx * dx + dz * dz;

    if (d2 > 1e-8) { const d = Math.sqrt(d2); pos.x += (dx / d) * (r - d); pos.z += (dz / d) * (r - d); }
    else {
      const pen = [pos.x - b.minX, b.maxX - pos.x, pos.z - b.minZ, b.maxZ - pos.z];
      const m = Math.min(...pen), i = pen.indexOf(m);
      if (i === 0) pos.x = b.minX - r; else if (i === 1) pos.x = b.maxX + r; else if (i === 2) pos.z = b.minZ - r; else pos.z = b.maxZ + r;
    }

function updatePlayer(dt) {

  P.velY -= 22 * dt; P.pos.y += P.velY * dt;
  if (P.pos.y <= 0) { P.pos.y = 0; P.velY = 0; P.onGround = true; }
  pushOutOfBoxes(P.pos, 0.4);

  P.eye += ((P.crouch ? 1.05 : 1.7) - P.eye) * Math.min(1, dt * 12);
  P.ads += ((adsHeld && !P.reloading && !sprint ? 1 : 0) - P.ads) * Math.min(1, dt * 12);
  P.sprinting = sprint;

  // Recul et récupération
  if (P.recoilPending > 0.001) {
    const step = P.recoilPending * Math.min(1, dt * 25);

  gunRoot.rotation.z += (tr[2] - gunRoot.rotation.z) * Math.min(1, dt * 10);

// ------------------------------------------------------------------ Mise à jour zombies
function updateZombies(dt) {
  for (let i = zombies.length - 1; i >= 0; i--) {

    }

        const ox = z.g.position.x - o.g.position.x, oz = z.g.position.z - o.g.position.z;
        const od = Math.hypot(ox, oz), min = z.radius + o.radius + 0.25;

      }

      if (moved < sp * 0.35) { z.stuck += dt; if (z.stuck > 0.4) { z.sideT = 1.2; z.stuck = 0; z.sideSign = Math.random() < 0.5 ? -1 : 1; } } else z.stuck = 0;

  } else {
    $("hWave").textContent = "STAND DE TIR";
    $("hSub").textContent = "Munitions infinies";
    const acc = P.shots ? ((P.hits / P.shots) * 100).toFixed(1) : "0.0";
    const hp = P.hits ? Math.round((P.heads / P.hits) * 100) : 0;
    $("stats").innerHTML = `Tirs ${P.shots}<br>Touches ${P.hits}<br>Précision ${acc} %<br>Tête ${hp} %<br>Cibles abattues ${P.kills}`;
  }
  const hpv = Math.ceil(P.hp);
  $("hHp").textContent = hpv;
  $("hBarFill").style.width = hpv + "%";
  $("hBar").classList.toggle("low", hpv < 35);
  const mag = $("hMag");
  mag.innerHTML = `${s.mag}<small> / ${G.mode === "training" ? "∞" : s.reserve}</small>`;
  mag.classList.toggle("empty", s.mag === 0);
  $("hWeapon").textContent = P.reloading ? "Rechargement…" : d.name;

  // Réticule dynamique
  const spread = d.pellets > 1 ? d.spread : currentSpread(d);
  const gap = Math.max(4, (Math.tan((spread * Math.PI) / 180) / Math.tan((camera.fov * Math.PI) / 360)) * (window.innerHeight / 2));
  const op = Math.max(0, 1 - P.ads * 1.6);
  $("chL").style.cssText = `left:${-gap - 9}px;opacity:${op}`; $("chR").style.cssText = `left:${gap}px;opacity:${op}`;
  $("chT").style.cssText = `top:${-gap - 9}px;opacity:${op}`; $("chB").style.cssText = `top:${gap}px;opacity:${op}`;
  $("chDot").style.opacity = P.ads > 0.7 ? 1 : 0;
  $("scope").style.opacity = d.adsFov < 56 && P.ads > 0.9 ? 0.85 : 0;
  $("hitmarker").style.opacity = G.time < hitUntil ? 1 : 0;
  $("dmgdir").style.opacity = G.time < dmgDirUntil ? Math.min(1, (dmgDirUntil - G.time) * 1.5) : 0;
  $("vignette").style.opacity = P.hp < 35 ? 0.6 + Math.sin(G.time * 6) * 0.15 : G.time - P.lastHit < 0.25 ? 0.5 : 0;
  $("announce").style.opacity = G.time < G.announceUntil ? 1 : 0;
  const b = nearestBuy();
  if (b) {
    const owned = P.slots.some((sl) => sl.id === b.weapon);
    const key = isTouch ? "UTIL." : "E";
    const price = buyPrice(b);
    $("prompt").innerHTML = `<span>[${key}] ${owned ? "Munitions" : "Acheter"} ${WEAPONS[b.weapon].name} · ${price} pts${P.points < price ? " (insuffisant)" : ""}</span>`;
  } else $("prompt").innerHTML = "";
}

// ------------------------------------------------------------------ Boucle
let last = performance.now();
let idleT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.state === "play") {
    G.time += dt;
    updatePlayer(dt);
    if (G.mode === "zombies") updateWaves(dt);
    updateZombies(dt);
    updateHud();
  } else if (G.state === "menu") {
    // Caméra qui survole l'arène derrière le menu
    idleT += dt * 0.08;
    camera.position.set(Math.sin(idleT) * 22, 9, Math.cos(idleT) * 22);
    camera.fov = 70; camera.updateProjectionMatrix();
    camera.lookAt(0, 1, 0);
    gunRoot.visible = false;
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt; p.v.y -= 12 * dt; p.m.position.addScaledVector(p.v, dt);
    if (p.life <= 0 || p.m.position.y < 0) { scene.remove(p.m); particles.splice(i, 1); }
  }
  for (let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i]; t.life -= dt;
    if (t.life <= 0) { scene.remove(t.l); t.l.geometry.dispose(); tracers.splice(i, 1); }
  }
  renderer.clear();
  renderer.render(scene, camera);
  if (G.state !== "menu") { renderer.clearDepth(); renderer.render(gunScene, gunCam); }
}
applyQuality();
setState("menu");
requestAnimationFrame(frame);
})();
</script>
