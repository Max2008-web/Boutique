; STRIKE ZONE - configuration moteur

[/Script/EngineSettings.GameMapsSettings]
; Carte à créer dans l'éditeur (niveau vide suffit) : /Game/Maps/StrikeArena
GameDefaultMap=/Game/Maps/StrikeArena.StrikeArena
EditorStartupMap=/Game/Maps/StrikeArena.StrikeArena
GlobalDefaultGameMode=/Script/StrikeZone.StrikeGameMode_Menu
GlobalDefaultServerGameMode=/Script/StrikeZone.StrikeGameMode_TeamDeathmatch
GameInstanceClass=/Script/StrikeZone.StrikeGameInstance
; Alias utilisables dans l'URL : open StrikeArena?game=Zombies
+GameModeClassAliases=(Name="Menu",GameMode="/Script/StrikeZone.StrikeGameMode_Menu")
+GameModeClassAliases=(Name="Zombies",GameMode="/Script/StrikeZone.StrikeGameMode_Zombies")
+GameModeClassAliases=(Name="QuickMatch",GameMode="/Script/StrikeZone.StrikeGameMode_TeamDeathmatch")
+GameModeClassAliases=(Name="BattleRoyale",GameMode="/Script/StrikeZone.StrikeGameMode_BattleRoyale")
+GameModeClassAliases=(Name="Tactical",GameMode="/Script/StrikeZone.StrikeGameMode_Tactical")
+GameModeClassAliases=(Name="Extraction",GameMode="/Script/StrikeZone.StrikeGameMode_Extraction")
+GameModeClassAliases=(Name="Training",GameMode="/Script/StrikeZone.StrikeGameMode_Training")

[/Script/Engine.CollisionProfile]
; Canal de trace des armes (COLLISION_WEAPON = ECC_GameTraceChannel1)
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Weapon")

[/Script/Engine.RendererSettings]
; PC : Lumen + ombres virtuelles. Les plateformes mobiles sont surchargées dans Config/Android.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.AntiAliasingMethod=4
r.DefaultFeature.MotionBlur=False
r.MobileHDR=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.strikezone.game
StoreVersion=1
VersionDisplayName=0.1.0
ApplicationDisplayName=Strike Zone
MinSDKVersion=26
TargetSDKVersion=34
Orientation=SensorLandscape
bFullScreen=True
bBuildForArm64=True
bBuildForX8664=False
bSupportsVulkan=True
bBuildForES31=True
bPackageDataInsideApk=False

[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True

[/Script/NavigationSystem.RecastNavMesh]
; La géométrie de l'arène est construite à l'exécution : le NavMesh doit être dynamique.
RuntimeGeneration=Dynamic

[/Script/Engine.Player]
ConfiguredInternetSpeed=100000
ConfiguredLanSpeed=100000

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetServerMaxTickRate=60
